name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Apple speech helper needs the macOS 26 SDK (Speech: DictationTranscriber).
      - name: En yeni Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Testler yerel ses modellerini yüklemez; yalnızca içe aktarılan paketler gerekir.
      - name: Python paketleri
        run: python -m pip install numpy httpx==0.28.1 sounddevice anthropic
      - name: Testler
        run: ASISTAN_PYTHON="$(which python)" bash test.sh
      - name: Uygulamayı derle
        run: ASISTAN_BUILD_OUTPUT="$RUNNER_TEMP/Asistan.app" bash build.sh
      # Asistan Mobile'daki AsistanCanli/MobileProtocol.swift ile birebir aynı olmalı. Aynı adlı dal varsa onunla, yoksa varsayılan dalla karşılaştırılır.
      - name: Ortak protokol dosyasını karşılaştır
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          curl -fsSL "https://raw.githubusercontent.com/mtahca/Asistan-Mobile/$branch/AsistanCanli/MobileProtocol.swift" -o "$RUNNER_TEMP/mobile.swift" \
            || curl -fsSL "https://raw.githubusercontent.com/mtahca/Asistan-Mobile/main/AsistanCanli/MobileProtocol.swift" -o "$RUNNER_TEMP/mobile.swift"
          diff -u app/MobileProtocol.swift "$RUNNER_TEMP/mobile.swift"
      # macOS, Info.plist'te listelenmeyen Bonjour türünü yayınlamaz (NoAuth); mobil bağlantı o zaman hiç açılmaz.
      - name: Bonjour servis türü Info.plist'te
        run: |
          type=$(sed -n 's/.*static let serviceType = "\(.*\)".*/\1/p' app/MobileProtocol.swift)
          /usr/libexec/PlistBuddy -c "Print :NSBonjourServices" app/Info.plist | grep -qx "[[:space:]]*$type"
